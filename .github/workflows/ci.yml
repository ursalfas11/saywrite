name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: swift build -c release --product Saywrite
      - name: Rules-only eval (no LLM on the runner, informational)
        run: |
          swift run -c release SaywriteEval Tests/Eval/cases.json --no-ai | tail -1
          swift run -c release SaywriteEval Tests/Eval/cases-en.json --no-ai | tail -1
